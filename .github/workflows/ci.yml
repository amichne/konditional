name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: ['21', '27']
        include:
          - os: ubuntu-latest
            java: '17'
            testOptions: -Pkonditional.test.javaVersion=8 -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test publication preview
        run: python3 -m unittest discover -s scripts -p test_publish_plan.py

      - name: Install the minimum library runtime
        if: matrix.testOptions
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: gradle

      - name: Run test suite
        run: ./gradlew test :build-logic:test --no-daemon --stacktrace ${{ matrix.testOptions }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-java${{ matrix.java }}
          path: |
            **/build/test-results/test/
            **/build/reports/tests/test/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Build library artifacts and publication metadata
        run: ./gradlew assemble generateMetadataFileForMavenPublication --no-daemon --stacktrace

  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Mintlify documentation
        run: make docs-build
